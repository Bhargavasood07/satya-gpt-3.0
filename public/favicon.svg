<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan & Emerald Cyber Gradients -->
    <linearGradient id="digitalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
  </defs>

  <!-- Digital Rounded Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#digitalBorder)" stroke-width="12" opacity="0.8"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M 256,56 L 416,120 V 248 C 416,348 348,432 256,472 C 164,432 96,348 96,248 V 120 Z" 
        fill="#131B2E" stroke="url(#digitalBorder)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Inner Tech Lattice Circuits -->
  <path d="M 256,108 V 420" stroke="#1E2D4A" stroke-width="6" stroke-dasharray="10 8"/>
  <path d="M 136,248 H 376" stroke="#1E2D4A" stroke-width="6" stroke-dasharray="10 8"/>
  
  <!-- Cyber Circuit Nodes -->
  <circle cx="256" cy="148" r="12" fill="#00E5FF"/>
  <circle cx="256" cy="368" r="12" fill="#10B981"/>
  <circle cx="156" cy="248" r="10" fill="#F59E0B"/>
  <circle cx="356" cy="248" r="10" fill="#00E5FF"/>

  <!-- Central SATYA-GPT Core Eye Shield -->
  <path d="M 256,178 C 310,178 348,248 348,248 C 348,248 310,318 256,318 C 202,318 164,248 164,248 C 164,248 202,178 256,178 Z" 
        fill="none" stroke="url(#coreGlow)" stroke-width="14" stroke-linejoin="round"/>
        
  <!-- Central Biometric Core Pupil -->
  <circle cx="256" cy="248" r="36" fill="#00E5FF"/>
  <circle cx="256" cy="248" r="16" fill="#0B0F19"/>
</svg>