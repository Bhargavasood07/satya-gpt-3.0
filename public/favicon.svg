<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan & Emerald Cyber Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#0B0F19"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M 256,48 L 416,112 V 240 C 416,340 348,424 256,464 C 164,424 96,340 96,240 V 112 Z" 
        fill="#131B2E" stroke="url(#shieldBorder)" stroke-width="14" stroke-linejoin="round" filter="url(#cyberGlow)"/>

  <!-- Inner Tech Lattice Circuits -->
  <path d="M 256,100 V 412" stroke="#1E2D4A" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 140,240 H 372" stroke="#1E2D4A" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Cyber Circuit Nodes -->
  <circle cx="256" cy="140" r="10" fill="#00E5FF"/>
  <circle cx="256" cy="360" r="10" fill="#10B981"/>
  <circle cx="160" cy="240" r="8" fill="#F59E0B"/>
  <circle cx="352" cy="240" r="8" fill="#00E5FF"/>

  <!-- Central SATYA-GPT Core Eye Shield -->
  <path d="M 256,170 C 310,170 348,240 348,240 C 348,240 310,310 256,310 C 202,310 164,240 164,240 C 164,240 202,170 256,170 Z" 
        fill="none" stroke="url(#coreGlow)" stroke-width="12" stroke-linejoin="round"/>
        
  <!-- Central Biometric Core Pupil -->
  <circle cx="256" cy="240" r="32" fill="#00E5FF"/>
  <circle cx="256" cy="240" r="14" fill="#0B0F19"/>
</svg>